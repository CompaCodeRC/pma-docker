server {
    listen 80;
    server_name pma.domain.net;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pma.domain.net;

    location / {
        proxy_pass http://$server_addr:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    client_max_body_size 20M;
    
    access_log /var/log/nginx/pma.domain.net-access.log;
    error_log  /var/log/nginx/pma.domain.net-error.log error;

    # SSL Configuration
    ssl_certificate /etc/ssl/webs/pma/cert.pem;
    ssl_certificate_key /etc/ssl/webs/pma/key.pem;
}