services:
  mariadb:
    image: mariadb:latest
    environment:
      MARIADB_ROOT_HOST: "%"
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mariadb

  pma:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mariadb
    ports:
      - "${PMA_PORT:-6001}:80"
    depends_on:
      - mariadb

volumes:
  mariadb_data: